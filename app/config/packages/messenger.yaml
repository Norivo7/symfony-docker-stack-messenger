framework:
    messenger:
        default_bus: messenger.bus.command

        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
#            async: 'redis://redis:6379/messages'
            async:
                dsn: 'redis://redis:6379/messages'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000

            failed: 'doctrine://default?queue_name=failed'
#            failed: 'redis://redis:6379/failed'
            # sync: 'sync://'

        buses:
            messenger.bus.command:
                middleware:
                    - App\Shared\Messenger\Middleware\ValidationMiddleware
                    - App\Shared\Messenger\Middleware\ErrorLoggingMiddleware
                    - App\Shared\Messenger\Middleware\PerformanceMiddleware

            messenger.bus.query:
                middleware:
                    - App\Shared\Messenger\Middleware\ValidationMiddleware
                    - App\Shared\Messenger\Middleware\PerformanceMiddleware

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            'App\Ping\Application\Messenger\Command\*': async
            'App\Task\Application\Messenger\Command\*': sync
